name: "ToneGet"
version: "0.3.0"
slug: "toneget"
description: "Sync personal Tonal workout data to Home Assistant"
url: "https://github.com/chubban-lgtm/toneget-ha-app"

arch:
  - amd64

init: false
startup: application
boot: auto

services:
  - mqtt:need

ports:
  8787/tcp: 8787

options:
  tonal_email: ""
  tonal_password: ""
  sync_interval: 900
  github_token: ""
  workout_repo: "chubban-lgtm/toneget-workout-data"
  workout_branch: "main"

schema:
  tonal_email: str
  tonal_password: password
  sync_interval: "int(300,86400)"
  github_token: password
  workout_repo: str
  workout_branch: str