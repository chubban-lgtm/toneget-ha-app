name: "ToneGet"
version: "0.2.5"
slug: "toneget"
description: "Sync personal Tonal workout data to Home Assistant"
url: "https://github.com/chubban-lgtm/toneget-ha-app"

arch:
  - amd64

init: false
startup: application
boot: auto

services:
  - mqtt:need

ports:
  8787/tcp: 8787

options:
  tonal_email: ""
  tonal_password: ""
  sync_interval: 900

schema:
  tonal_email: str
  tonal_password: password
  sync_interval: "int(300,86400)"